[project]
name = "gdkpixbuf-glibc-build"
version = "0.1.0"
description = "Host Python build tools for the scratch GdkPixbuf glibc provider build"
requires-python = ">=3.14,<3.15"
dependencies = [
    "meson==1.11.1",
]

[tool.uv]
package = false
python-downloads = "never"
python-preference = "only-system"
